name: CI

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ext_set: [required, recommended]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            EXT_SET=${{ matrix.ext_set }}
          cache-from: type=gha,scope=ci-${{ matrix.ext_set }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.ext_set }}

      - name: Prune old runs (keep 3 per workflow)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 3